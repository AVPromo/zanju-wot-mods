# Configurator tooltips
TOOLTIP_CLICK_TO_RESEARCH_BODY: "Enables research or purchase of items on the bar whenever possible. This uses the game's native confirmation windows, so there is no risk of a misclick."
TOOLTIP_SHOW_TOTAL_XP_BODY: "Show Total XP progress, which combines Vehicle XP with Free XP. The Total XP counter next to the bar and the matching row in tooltips show the combined progress, while the yellow bar segment and yellow markers show what could be researched using Free XP."
TOOLTIP_RESEARCH_REMINDER_BODY: "Show the \"Research now!\" reminder above the mode buttons."
TOOLTIP_ACCELERATED_CREW_TRAINING_REMINDER_BODY: "Show the \"Accelerate crew training!\" reminder above the mode buttons."
TOOLTIP_RESEARCH_BODY: "<b>Show hypothetical tier 11 in research</b>: Shows progress towards tier 11 vehicle which might exist in the future.\n<b>Show only real research items</b>: Shows progress only towards research items which exist now.\n<b>Off</b>: Hide research entirely."
TOOLTIP_FIELD_MODS_HEADER: "Field Mods"
TOOLTIP_FIELD_MODS_BODY: "<b>Always show</b>: Keep the field mods mode available even after all field modifications are complete.\n<b>Until complete</b>: Hide the field mods mode once all field modifications are complete.\n<b>Off</b>: Hide field mods entirely."
TOOLTIP_UPGRADES_BODY: "Show tier XI upgrade tree progress."
TOOLTIP_ELITE_HEADER: "Elite"
TOOLTIP_ELITE_BODY: "<b>On</b>: Show elite badges and tier XI customization elements.\n<b>Customization only</b>: Show tier XI customization elements and hide elite badges.\n<b>Off</b>: Hide elite progress entirely."

