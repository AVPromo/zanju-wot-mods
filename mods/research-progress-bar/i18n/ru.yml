TOOLTIP_ACCELERATED_CREW_TRAINING_REMINDER_BODY: "Показывать напоминание «Ускорьте обучение экипажа!» над кнопками режимов."
TOOLTIP_RESEARCH_BODY: "<b>Показывать гипотетическую машину XI уровня в исследованиях</b>: Показывать прогресс для машины XI уровня, которая может появиться в будущем.\n<b>Показывать только реально возможные исследования</b>: Показывать прогресс только для тех исследований, которые существуют сейчас.\n<b>Отключено</b>: Полностью скрывать исследование."
TOOLTIP_FIELD_MODS_HEADER: "Модернизация"
TOOLTIP_FIELD_MODS_BODY: "<b>Всегда показывать</b>: Делает режим полевой модернизации доступным даже после его завершения.\n<b>Только незавершённую</b>: Скрывать режим полевой модернизации после его завершения.\n<b>Отключено</b>: Полностью скрывать режим полевой модернизации."
TOOLTIP_UPGRADES_BODY: "Показывать прогресс дерева улучшений XI уровня."
TOOLTIP_ELITE_HEADER: "Элитность"
TOOLTIP_ELITE_BODY: "<b>Включено</b>: Показывать и элитные значки, и элементы кастомизации XI уровня.\n<b>Только кастомизация</b>: Показывать элементы кастомизации XI уровня и скрывать элитные значки.\n<b>Отключено</b>: Полностью скрывать прогресс элитности."
TOOLTIP_SHOW_TOTAL_XP_BODY: "Показывать общий прогресс опыта, который объединяет боевой и свободный опыт. Счетчик общего опыта рядом со шкалой и соответствующая строка во всплывающих подсказках покажут общий прогресс, а желтая полоса на индикаторе и желтые маркеры покажут, что можно исследовать, используя свободный опыт."
