# Configurator tooltips
TOOLTIP_CLICK_TO_RESEARCH_BODY: "Umożliwia badanie lub kupowanie elementów bezpośrednio z paska, gdy tylko jest to możliwe. Korzysta z natywnych okien potwierdzenia gry, więc nie ma ryzyka przypadkowego kliknięcia."
TOOLTIP_SHOW_TOTAL_XP_BODY: "Pokaż postęp Łącznych PD, czyli PD pojazdu razem z Wolnymi PD. Licznik Łącznych PD obok paska oraz odpowiadający mu wiersz w podpowiedziach pokazują łączny postęp, a żółta część paska i żółte znaczniki pokazują, co można zbadać z użyciem Wolnych PD."
TOOLTIP_RESEARCH_REMINDER_BODY: "Pokaż przypomnienie \"Badaj teraz!\" nad przyciskami trybów."
TOOLTIP_ACCELERATED_CREW_TRAINING_REMINDER_BODY: "Pokaż przypomnienie \"Przyspiesz szkolenie załogi!\" nad przyciskami trybów."
TOOLTIP_RESEARCH_BODY: "<b>Pokaż hipotetyczny pojazd XI poziomu w badaniach</b>: Pokazuje postęp w kierunku pojazdu XI poziomu, który może pojawić się w przyszłości.\n<b>Pokaż tylko prawdziwe elementy badań</b>: Pokazuje postęp tylko w kierunku elementów badań, które istnieją obecnie.\n<b>Wyłączone</b>: Całkowicie ukryj badania."
TOOLTIP_FIELD_MODS_HEADER: "Ulepszenia polowe"
TOOLTIP_FIELD_MODS_BODY: "<b>Zawsze pokazuj</b>: Pozostaw tryb ulepszeń polowych dostępny nawet po ukończeniu wszystkich ulepszeń polowych.\n<b>Do ukończenia</b>: Ukryj tryb ulepszeń polowych po ukończeniu wszystkich ulepszeń polowych.\n<b>Wyłączone</b>: Całkowicie ukryj ulepszenia polowe."
TOOLTIP_UPGRADES_BODY: "Pokaż postęp drzewka ulepszeń XI poziomu."
TOOLTIP_ELITE_HEADER: "Elita"
TOOLTIP_ELITE_BODY: "<b>Włączone</b>: Pokaż elitarne odznaki i elementy personalizacji XI poziomu.\n<b>Tylko personalizacja</b>: Pokaż elementy personalizacji XI poziomu i ukryj elitarne odznaki.\n<b>Wyłączone</b>: Ukryj postęp elity."

