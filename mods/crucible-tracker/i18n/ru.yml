# Всплывающая карточка
LABEL_NO_ACTIVE: "Нет активного Вызова"
# {stage} — номер текущей задачи, {total} — общее количество задач в Вызове.
LABEL_MISSION: "Задача {stage} из {total}"
# Отображается над условиями задачи в списке активного Вызова. {stage} — это номер задачи.
LABEL_MISSION_NUMBER: "Задача {stage}"
# {done} — сколько раз игрок завершил Вызов, {allowed} — сколько раз Вызов позволяет это сделать.
LABEL_COMPLETIONS: "Завершено: {done} / {allowed}"
# Вызов можно запустить.
LABEL_AVAILABLE: "Доступно"
# У Вызова закончились щиты, и следующий перезапуск бесплатный.
LABEL_FREE_RESTART: "Доступен бесплатный перезапуск"
# У Вызова закончились щиты. Цена и иконка валюты отображаются после этого текста.
LABEL_RESTART_FOR: "Доступен перезапуск за:"
# Отображается над списком названий техники (по одной на строку).
LABEL_IN_BATTLE: "Техника в бою:"
# Техника, подходящая для Вызова, находится в бою, который ещё не завершился. Этот текст показывается как при активном Вызове, так и без него.
LABEL_IN_BATTLE_WARNING: "Если во время завершения боя активен Вызов, результат этого текущего боя может завершить или провалить текущую задачу."
# Последняя строка всплывающей карточки.
LABEL_HINT_OPEN: "Нажмите, чтобы открыть меню Вызова"

# Настройки в меню модов
SETTING_GARAGE: "Баннер в Ангаре"
TOOLTIP_GARAGE_BODY: "Показывать баннер Вызова рядом с названием техники в ангаре вместе со всплывающей подсказкой."
SETTING_BATTLE: "Панель в бою"
TOOLTIP_BATTLE_BODY: "Показывать прогресс текущей задачи Вызова прямо в бою. Зажмите Ctrl и перетащите панель, чтобы изменить её положение."
# Три доступных варианта берутся из собственных настроек игрового клиента для панели повреждений: «Отображать всегда», «Показывать по Alt», «Не отображать».
SETTING_PANEL_DETAILS: "Подробности боевой панели"
TOOLTIP_PANEL_DETAILS_BODY: "Определяет, когда боевая панель отображает полную информацию вместо только самой необходимой."
