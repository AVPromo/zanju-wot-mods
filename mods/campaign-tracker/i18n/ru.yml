# Состояния виджета
# Также отображается, когда в ангаре вообще нет техники, поэтому формулировка должна быть общей.
LABEL_NO_MISSION: "Для этого танка нет задач"
LABEL_PAUSED: "Задача на паузе"

# Всплывающая подсказка
# «Блокировка» означает, что танк уже выполнил эту задачу и не может её повторить.
LABEL_LOCKED_VEHICLES: "Заблокированные танки:"
LABEL_VEHICLE_LOCKED: "Танк заблокирован"
# «Бланк приказа» — это игровой предмет, который закрывает основное условие. Остаётся в единственном числе для любого количества.
LABEL_PAWNED: "Возврат бланка приказа"
# {percent} от среднего значения, необходимого для выполнения задачи за бой, а не от общего количества. 100% — это выполнение нормы.
LABEL_PACE: "{percent}% от целевого среднего за бой"

# Подсказки по клику в нижней части всплывающего окна
LABEL_HINT_OPEN: "ЛКМ — открыть задачу"
LABEL_HINT_PAUSE: "Shift + ЛКМ — поставить задачу на паузу"
LABEL_HINT_RESUME: "Shift + ЛКМ — возобновить задачу"
LABEL_HINT_RESET: "Ctrl + ЛКМ — сбросить прогресс задачи"
