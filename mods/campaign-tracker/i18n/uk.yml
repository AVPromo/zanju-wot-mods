# Widget states
# Also shown when there is no vehicle in the garage at all, so keep the wording general.
LABEL_NO_MISSION: "Немає завдання для цієї техніки"
LABEL_PAUSED: "Завдання на паузі"

# Tooltip
# "Locked" means the vehicle already completed this mission and cannot repeat it.
LABEL_LOCKED_VEHICLES: "Заблокована техніка:"
LABEL_VEHICLE_LOCKED: "Техніка заблокована"
# An order is the game item that completes a primary condition. Stays singular for any number.
LABEL_PAWNED: "Повернення бланка наказу"
# {percent} of the average the mission needs per battle, not of the total. 100 is on target.
LABEL_PACE: "{percent}% від цільового середнього показника за бій"

# Click hints, at the foot of the tooltip
LABEL_HINT_OPEN: "ЛКМ — відкрити завдання"
LABEL_HINT_PAUSE: "Shift + ЛКМ — поставити завдання на паузу"
LABEL_HINT_RESUME: "Shift + ЛКМ — продовжити завдання"
LABEL_HINT_RESET: "Ctrl + ЛКМ — скинути прогрес завдання"
