# Строки, используемые несколькими модами. Каждому моду достаются те ключи, которые задействованы в его коде.

# Единицы оставшегося времени, например: "3д 05ч", "2ч 11м", "5м 12с". Оставляйте каждую единицу длиной в одну или две буквы, так как кнопки Премиум аккаунта в шапке Ангара имеют мало места.
UNIT_DAY_SHORT: "д"
UNIT_HOUR_SHORT: "ч"
UNIT_MINUTE_SHORT: "м"
UNIT_SECOND_SHORT: "с"

# Настройки в меню модов: сторона от названия техники для строки баннеров, которую делят между собой Отслеживание кампаний и Отслеживание Вызовов.
SETTING_TRAY_SIDE: "Расположение баннера"
SETTING_TRAY_SIDE_RIGHT: "Справа от названия техники"
SETTING_TRAY_SIDE_LEFT: "Слева от названия техники"
TOOLTIP_TRAY_SIDE_BODY: "Сторона от названия техники для размещения баннеров этого мода. Баннеры всех модов от Zanju, расположенные с одной стороны, делят между собой одну строку."
