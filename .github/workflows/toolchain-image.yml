name: Build toolchain image

# Builds and publishes the all-in-one build/lint image to GHCR.
# Reusable (called by the release workflow when the image inputs change) and
# manually dispatchable (first-time bootstrap / on-demand rebuild).
# No push trigger: the release workflow is the single serialized automatic path,
# which avoids a double build and the stale-:latest race.
on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  build-image:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: tools/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/toolchain:latest
          ghcr.io/${{ github.repository }}/toolchain:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
