name: Stable Release

on:
  push:
    branches:
    - master
  workflow_dispatch: {}

concurrency:
  group: stable-release
  cancel-in-progress: true

jobs:
  stable-release:
    name: Build and Publish Stable Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3 host
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build stable release toolchain image
      run: docker build --tag zanju-wot-mods-stable-release --file .github/docker/stable-release/Dockerfile .

    - name: Build all mods inside release container
      shell: bash
      run: |
        set -euo pipefail
        rm -rf dist
        mkdir -p .tmp
        trap 'rm -f .env' EXIT
        cat > .env <<'EOF'
        WOT_PYTHON2_EXE=/opt/python2.7/bin/python2.7
        EOF
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -v "${GITHUB_WORKSPACE}:/workspace" \
          -w /workspace \
          zanju-wot-mods-stable-release \
          bash -lc 'python -m tools.fetch_companion_artifacts && python -m tools.build --all'

    - name: Generate stable release notes
      run: python .github/scripts/generate_stable_release_notes.py --output .tmp/stable-release-notes.md

    - name: Publish rolling stable release
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        python .github/scripts/sync_stable_release.py
        --tag stable
        --title "Stable build"
        --notes-file .tmp/stable-release-notes.md
