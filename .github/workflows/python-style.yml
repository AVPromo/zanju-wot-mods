name: Python Format and Lint Checks

on:
  pull_request: {}
  push:
    # master is excluded: the "Master Workflow" already runs this same lint
    # as its release gate, so linting it here too would double the master runs.
    branches-ignore:
    - master
  workflow_dispatch: {}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
