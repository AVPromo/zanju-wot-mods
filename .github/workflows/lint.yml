name: Lint

# Reusable lint definition (single source of truth for "what linting means").
# Runs inside the published build image, so CI and local use the exact same
# Python 3 + Python 2.7 + tooling. Called by python-style.yml (every push / PR)
# and stable-release.yml (release gate).
on:
  workflow_call: {}

jobs:
  lint:
    name: Format and Lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/toolchain:latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Python 3 format and lint (Black + Ruff)
      run: python3 -m tools.lint py3-check

    - name: Python 2.7 format check (autopep8 via Python 3)
      run: python3 -m tools.lint py27-format-check

    - name: Python 2.7 lint (Flake8 via Python 2.7)
      run: python3 -m tools.lint py27-lint --py27-python python2.7
